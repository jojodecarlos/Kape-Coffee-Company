<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kapé — My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-register">
  <header>
    <nav class="nav container" aria-label="Main">
      <div class="nav-left">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="brews.html">Brew Guides</a>
      </div>
      <a class="brand" href="index.html" aria-label="Kapé brand">Kapé</a>
      <div class="nav-right" style="justify-content:flex-end">
        <a href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <section class="hero hero--plain" style="min-height:34vh;">
    <div class="container" style="max-width:900px">
      <h1>My Profile</h1>
      <p>Manage your account information and preferences.</p>
      <p id="profile-email" style="opacity:.9;margin-top:.4rem"></p>
      <p style="margin-top:12px">
        <button id="signout-btn" class="btn">Sign out</button>
      </p>
    </div>
  </section>

  <main>

    <section class="lead-capture">
      <div class="container">
        <form class="lead-form" id="profile-form" autocomplete="on">
          <h2 style="margin:0 0 .5rem">Profile details</h2>

          <div class="grid two-col">
            <div class="field">
              <label for="first_name">First name</label>
              <input id="first_name" name="first_name" type="text" autocomplete="given-name">
            </div>
            <div class="field">
              <label for="last_name">Last name</label>
              <input id="last_name" name="last_name" type="text" autocomplete="family-name">
            </div>
          </div>

          <div class="grid two-col">
            <div class="field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div class="field">
              <label for="country">Country</label>
              <select id="country" name="country" autocomplete="country-name">
                <option value="">Select a country</option>
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="PH">Philippines</option>
                <option value="GB">United Kingdom</option>
                <option value="AU">Australia</option>
              </select>
            </div>
          </div>

          <div class="grid three-col">
            <div class="field">
              <label for="address">Address</label>
              <input id="address" name="address" type="text" autocomplete="address-line1">
            </div>
            <div class="field">
              <label for="city">City</label>
              <input id="city" name="city" type="text" autocomplete="address-level2">
            </div>
            <div class="field">
              <label for="postal">ZIP/Postal code</label>
              <input id="postal" name="postal" type="text" autocomplete="postal-code">
            </div>
          </div>

          <div class="grid two-col">
            <div class="field">
              <label for="interest">Interests</label>
              <select id="interest" name="interest">
                <option value="">Choose one</option>
                <option value="beans">Coffee drops</option>
                <option value="pop-ups">Pop-ups &amp; Events</option>
                <option value="recipes">Recipes</option>
                <option value="all">All of the above</option>
              </select>
            </div>
          </div>

          <div class="actions">
            <button class="btn cta" type="submit" id="save-profile-btn">Save profile</button>
          </div>

          <p id="profile-status" style="margin:.4rem 0 0; opacity:.9"></p>
        </form>
      </div>
    </section>


    <section class="lead-capture">
      <div class="container">
        <form class="lead-form" id="password-form" autocomplete="off">
          <h2 style="margin:0 0 .5rem">Change password</h2>

          <div class="grid three-col">
            <div class="field">
              <label for="old_password">Current password</label>
              <input id="old_password" name="old_password" type="password" autocomplete="current-password" required>
            </div>
            <div class="field">
              <label for="new_password">New password</label>
              <input id="new_password" name="new_password" type="password" minlength="8" required>
            </div>
            <div class="field">
              <label for="new_password_confirm">Confirm new password</label>
              <input id="new_password_confirm" name="new_password_confirm" type="password" minlength="8" required>
            </div>
          </div>

          <div class="actions">
            <button class="btn" type="submit" id="save-password-btn">Update password</button>
          </div>

          <p id="password-status" style="margin:.4rem 0 0; opacity:.9"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="container foot-grid">
      <div><h3 class="bigbrand">Kapé</h3></div>
      <div class="foot-cols">
        <div class="foot">
          <h4>Location</h4>
          <p class="address">1234 Orange Ave<br>Orlando, FL 32801</p>
        </div>
        <div class="foot">
          <p>
            <a href="index.html">Home</a><br>
            <a href="about.html">About</a><br>
            <a href="brews.html">Brew guide</a><br>
            <a href="signin.html">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </footer>


  <script type="module" src="app.js"></script>
</body>
</html>
